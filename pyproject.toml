[project]
name = "shard-puzzles"
version = "0.1.0"
description = "Puzzles for reasoning about tensor shapes and distributed layouts, checked on CPU."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "sympy>=1.12", "numpy"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
exclude = ["puzzles/*"]  # the "your code" sections are generated by tools/build_stubs.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["F403", "F405", "E741", "E702", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["shardpuzzles", "puzzles", "solutions"]

[tool.ruff.lint.per-file-ignores]
"puzzles/*" = ["E501", "F841"]  # stubs leave TODO variables unused
"solutions/*" = ["E501"]  # hint strings are one line each

[tool.pyright]
include = ["shardpuzzles", "puzzles", "solutions", "tools", "tests", "check.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
